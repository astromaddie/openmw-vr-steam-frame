# Recommended OpenMW settings for the Steam Frame (openmw-vr-steam-frame).
# setup.sh writes this as ~/.config/openmw/settings.cfg on a fresh install. If that file already exists,
# add these lines yourself (OpenMW keeps only settings that differ from its defaults in that file).

[GUI]
# Largest font OpenMW allows (12-18); VR text is small at the default 16.
font size = 18

[VR]
# The desktop mirror window only feeds Steam's 2D preview; skip copying both eyes into it every frame.
mirror texture = false
